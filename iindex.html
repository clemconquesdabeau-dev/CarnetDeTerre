ap:36px;padding-top:38px}}.kick{font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin:0 0 14px}h1{font-size:clamp(36px,6vw,62px);line-height:1.04;font-weight:700;letter-spacing:-.01em;margin-bottom:20px}.lead{font-size:21px;color:var(--mute);max-width:33em;margin:0 0 28px}.btn{display:inline-block;border:2px solid var(--green);background:var(--green);color:var(--ongreen);font:700 17px 'Alegreya Sans',serif;padding:12px 24px;text-decoration:none;cursor:pointer;border-radius:3px}.btn.alt{background:transparent;color:var(--green)}.btn.ochre{background:var(--ochre);border-color:var(--ochre);color:#1B2B1F}.btn[disabled]{opacity:.4;cursor:not-allowed}.acts{display:flex;gap:14px;flex-wrap:wrap;align-items:center}.plate{background:#FBF9F5;border:2px solid var(--ink);padding:16px;box-shadow:8px 8px 0 var(--ochre);transform:rotate(-1.2deg);justify-self:center;width:100%;max-width:400px}.plate img{display:block;width:100%;height:auto}.ledger{display:grid;grid-template-columns:minmax(0,290px) 1fr;gap:40px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:26px 0;margin-bottom:72px}@media (max-width:760px){.ledger{grid-template-columns:1fr;gap:18px}}.ledger h2{font-size:26px;margin-bottom:6px}.note{font-size:15px;color:var(--mute)}.led{display:flex;align-items:baseline;gap:10px;padding:7px 0}.led i{flex:1;border-bottom:2px dotted var(--rule);transform:translateY(-4px)}.led b{font-family:'Zilla Slab',Georgia,serif;font-size:22px}
